{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block page_title %}Reports{% endblock %}
{% block content %}
<div class="page-header"><h3>Reports</h3></div>
<div class="row g-3">
    {% for r in reports %}
    <div class="col-md-6 col-xl-4"><a href="{% url r.url %}" class="card card-body h-100 text-decoration-none text-dark">
        <h5><i class="bi {{ r.icon }} text-primary"></i> {{ r.title }}</h5>
        <p class="text-muted small mb-0">{{ r.text }}</p></a></div>
    {% endfor %}
</div>
{% endblock %}
