{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header">{{ title }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-accent">Save</button>
                    {% if back_url %}<a href="{% url back_url %}" class="btn btn-link">Cancel</a>{% endif %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
