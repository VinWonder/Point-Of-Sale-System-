{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="col-lg-6"><div class="card"><div class="card-header">{{ title }}</div><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-accent mt-2">Save</button>
    </form>
</div></div></div>
{% endblock %}
