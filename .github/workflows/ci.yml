name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hardware_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      DB_ENGINE: ${{ matrix.db }}
      DB_NAME: hardware_pos
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django>=5.2.8,<5.3" djangorestframework psycopg2-binary python-decouple \
            django-crispy-forms crispy-bootstrap5 django-daraja whitenoise
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run accounts branches core customers dashboard inventory payments registers sales
      - name: Django system checks
        run: python manage.py check
      - name: Collect static files
        run: python manage.py collectstatic --noinput -v0
      - name: Run tests
        run: python manage.py test -v2
